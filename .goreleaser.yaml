# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: bluefin-report

builds:
  - id: bluefin-report
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      # {{ .Tag }}, not {{ .Version }}: the calendar scheme is YY.MM.N and
      # GoReleaser's semver parser normalises 26.09.1 to 26.9.1, which would
      # drop the zero that makes the version read as a date.
      - -s -w -X github.com/projectbluefin/bluefin-report/internal/ui.Version={{ .Tag }}
    main: ./cmd/bluefin-report

archives:
  - name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - data/bluefin-report-wrapper.sh
      - data/io.projectbluefin.Report.desktop
      - data/io.projectbluefin.Report.metainfo.xml
      - data/icons/**/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github

release:
  prerelease: auto
