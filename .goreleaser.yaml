# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: bluefin-report

builds:
  - id: bluefin-report
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
    main: ./cmd/bluefin-report

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - data/bluefin-report-wrapper.sh
      - data/io.projectbluefin.Report.desktop
      - data/io.projectbluefin.Report.metainfo.xml
      - data/icons/**/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github

release:
  prerelease: auto
